services:
  chrome:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --headless=new
      - --disable-blink-features=AutomationControlled
      - --proxy-server=http://host.docker.internal:1080
